name: Send Currency Strength

on:
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Publish this manual run to the Telegram channel"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "15 17 * * 1-5"
      timezone: "America/New_York"

jobs:
  send-message:
    runs-on: ubuntu-latest
    concurrency:
      group: currency-strength-channel
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Build and publish G10 currency post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CURRENCY_CHAT_ID: ${{ secrets.CURRENCY_CHAT_ID }}
          PUBLISH_TO_TELEGRAM: ${{ (github.event_name == 'schedule' || inputs.publish_now) && 'true' || 'false' }}
        run: python send_currency_strength.py
