name: Send Dollar Price

on:
  schedule:
    # هر ۳۰ دقیقه یک‌بار اجرا می‌شه (زمان بر اساس UTC است)
    - cron: "0 * * * *"
  workflow_dispatch: # امکان اجرای دستی از تب Actions برای تست

jobs:
  send-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

     - name: Send price to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ALANCHAND_TOKEN: ${{ secrets.ALANCHAND_TOKEN }}
        run: python send_price.py
