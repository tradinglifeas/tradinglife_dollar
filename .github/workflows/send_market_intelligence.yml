name: TradingLife Market Intelligence

on:
  schedule:
    # 09:30 Iran = 06:00 UTC
    - cron: '0 6 * * *'
    # 15:00 Iran = 11:30 UTC
    - cron: '30 11 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: "full = history + spot; refresh = cached history + fresh spot"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - refresh
      asset:
        description: "Test one asset first to conserve Alpha Vantage quota"
        required: true
        default: "XAU"
        type: choice
        options:
          - XAU
          - XAG
          - BTC
          - ETH
          - SOL
          - XRP
          - ADA
          - DOGE
          - ALL

permissions:
  contents: write

jobs:
  market-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Select mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RUN_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
            echo "ASSET_FILTER=${{ inputs.asset }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "RUN_MODE=full" >> "$GITHUB_ENV"
            echo "ASSET_FILTER=ALL" >> "$GITHUB_ENV"
          else
            echo "RUN_MODE=refresh" >> "$GITHUB_ENV"
            echo "ASSET_FILTER=ALL" >> "$GITHUB_ENV"
          fi

      - name: Build cards and send to Telegram
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python send_market_intelligence.py

      - name: Save cache and state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f tradinglife_state.json ] && git add tradinglife_state.json || true
          if [ "$RUN_MODE" = "full" ] && [ "$ASSET_FILTER" = "ALL" ] && [ -f market_intelligence_cache.json ]; then
            git add market_intelligence_cache.json
          fi
          if git diff --cached --quiet; then
            echo "No state/cache changes."
          else
            git commit -m "Update TradingLife intelligence state [skip ci]"
            git push
          fi
