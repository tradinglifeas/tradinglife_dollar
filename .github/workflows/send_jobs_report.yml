name: Send Jobs Report

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "ارسال آزمایشی حتی اگر امروز جمعه‌ی اول ماه نباشه (true/false)"
        required: false
        default: "false"

jobs:
  send-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pillow
      - name: Download Persian font
        run: |
          curl -sL -o Vazirmatn-Regular.ttf https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Regular.ttf
          curl -sL -o Vazirmatn-Bold.ttf https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Bold.ttf
      - name: Build and send jobs report
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: python send_jobs_report.py
