name: Send Gold Image

on:
   schedule:
    - cron: '30 9 * * *'
    - cron: '0 15 * * *'
  

  workflow_dispatch:

permissions:
  contents: write
jobs:
  send-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pillow
      - name: Download Persian font
        run: |
          curl -sL -o Vazirmatn-Regular.ttf https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Regular.ttf
          curl -sL -o Vazirmatn-Bold.ttf https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Bold.ttf
      - name: Build and send image
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
        run: python send_gold_image.py
      - name: Save price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gold_history_series.json
          git diff --staged --quiet || git commit -m "Update gold history [skip ci]"
          git push
