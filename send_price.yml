name: Send Dollar Price

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if already sent in the last 2 hours"
        type: boolean
        default: false

jobs:
  send-price:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Skip if already sent recently (duplicate guard, protects Navasan quota)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '-2 hours' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "${{ github.repository }}" --workflow "${{ github.workflow }}" \
                --created ">=$since" --limit 50 --json databaseId,status,conclusion \
                --jq '[.[] | select(.databaseId < ${{ github.run_id }})
                       | select(.conclusion == "success" or .status != "completed")] | length')
          echo "Earlier successful/in-progress runs in the last 2h: $n"
          if [ "$n" -gt 0 ]; then
            echo "::notice::Duplicate run - already sent in the last 2 hours. Nothing was posted."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout repository
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests jdatetime
      - name: Send price to Telegram
        if: steps.guard.outputs.skip != 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          NAVASAN_API_KEY: ${{ secrets.NAVASAN_API_KEY }}
        run: python send_price.py
      - name: Save price cache for the gold image card
        if: steps.guard.outputs.skip != 'true'
        run: |
          [ -f navasan_cache.json ] || { echo "No cache written (Friday or quiet hours)."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add navasan_cache.json
          if git diff --cached --quiet; then echo "Cache unchanged."; exit 0; fi
          git commit -m "Update Navasan price cache"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          echo "::warning::Could not push navasan_cache.json"
          exit 1
